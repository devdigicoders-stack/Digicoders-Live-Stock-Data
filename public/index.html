<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DigiCoders Live Stock Data</title>
  <style>
    :root {
      --font-size: 10px;
      --y-offset: 2px; /* Shifted DOWN by 2px for perfect vertical centering of 10px font */
      --gap: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #FFFFFF;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .ticker-viewport {
      width: 100%;
      height: 100vh;
      max-height: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      position: relative;
      background: #000000;
    }

    /* Boundary lines for 16px calibration (when ?guide=1 or 'G' key pressed) */
    .ticker-viewport.guide-mode::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #ff0055;
      z-index: 100;
    }
    .ticker-viewport.guide-mode::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #00e5ff;
      z-index: 100;
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      will-change: transform;
      position: relative;
      top: var(--y-offset, 2px);
    }

    .ticker-text {
      display: inline-flex;
      align-items: center;
      font-family: Arial Black, "Arial Black", Impact, sans-serif;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
      padding-right: var(--gap, 20px);
    }

    @keyframes seamless-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .item {
      display: inline-flex;
      align-items: center;
      margin-right: var(--gap, 20px);
      line-height: 1;
      white-space: nowrap;
    }

    .symbol {
      color: #FFD700;
      margin-right: 4px;
      font-weight: 900;
    }

    .value {
      color: #FFFFFF;
      margin-right: 4px;
      font-weight: 900;
    }

    .up {
      color: #00FF00;
      display: inline-flex;
      align-items: center;
      font-weight: 900;
    }

    .down {
      color: #FF3333;
      display: inline-flex;
      align-items: center;
      font-weight: 900;
    }

    .arrow {
      display: inline-block;
      margin-right: 2px;
      line-height: 1;
      font-size: 10px;
    }

    /* Live notification for keyboard adjustments */
    #info-toast {
      position: fixed;
      top: 1px;
      right: 4px;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #444;
      color: #00ffea;
      font-family: monospace;
      font-size: 8px;
      padding: 1px 4px;
      z-index: 999;
      display: none;
    }


  </style>
</head>
<body>
  <div class="ticker-viewport" id="viewport">
    <div class="ticker-track" id="ticker-track">
      <div class="ticker-text" id="ticker"></div>
      <div class="ticker-text" id="ticker-clone"></div>
    </div>
  </div>

  <div id="info-toast"></div>

  <script>
    function getStoredConfig() {
      try {
        const raw = localStorage.getItem("ticker_config_v5");
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const saved = getStoredConfig();

    function getNum(paramVal, savedVal, defaultVal) {
      if (paramVal !== null && paramVal !== undefined && paramVal !== "" && !isNaN(Number(paramVal))) {
        return Number(paramVal);
      }
      if (savedVal !== null && savedVal !== undefined && savedVal !== "" && !isNaN(Number(savedVal))) {
        return Number(savedVal);
      }
      return defaultVal;
    }

    const config = {
      yOffset: getNum(urlParams.get("y"), saved.yOffset, 2), // Default +2px down for 10px font
      fontSize: 10, // Fixed 10px
      gap: getNum(urlParams.get("gap"), saved.gap, 20),
      speed: getNum(urlParams.get("speed"), saved.speed, 60),
      guide: urlParams.get("guide") === "1"
    };

    function applyConfig() {
      document.documentElement.style.setProperty("--y-offset", config.yOffset + "px");
      document.documentElement.style.setProperty("--font-size", config.fontSize + "px");
      document.documentElement.style.setProperty("--gap", config.gap + "px");

      const viewport = document.getElementById("viewport");
      if (viewport) {
        if (config.guide) {
          viewport.classList.add("guide-mode");
        } else {
          viewport.classList.remove("guide-mode");
        }
      }

      try {
        localStorage.setItem("ticker_config_v5", JSON.stringify(config));
      } catch (e) {}
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("info-toast");
      if (!toast) return;
      toast.textContent = msg || `Y: ${config.yOffset}px | Size: 10px | Speed: ${config.speed}s`;
      toast.style.display = "block";
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() {
        toast.style.display = "none";
      }, 2500);
    }

    // Keyboard Shortcuts for Live Adjustment
    window.addEventListener("keydown", function(e) {
      let changed = false;
      if (e.key === "ArrowUp") {
        config.yOffset -= 1; // Move text UP
        changed = true;
      } else if (e.key === "ArrowDown") {
        config.yOffset += 1; // Move text DOWN
        changed = true;
      } else if (e.key === "]" || e.key === "}") {
        config.speed += 5; // Slower scroll
        changed = true;
      } else if (e.key === "[" || e.key === "{") {
        config.speed = Math.max(5, config.speed - 5); // Faster scroll
        changed = true;
      } else if (e.key.toLowerCase() === "g") {
        config.guide = !config.guide; // Toggle guide
        changed = true;
      } else if (e.key.toLowerCase() === "r") {
        config.yOffset = 2;
        config.gap = 20;
        config.speed = 60;
        changed = true;
      }

      if (changed) {
        applyConfig();
        showToast();
      }
    });

    // Instruments list (symbols only, no hardcoded values)
    const INSTRUMENTS = [
      { id: "NIFTY", symbol: "NIFTY 50", tvSymbol: "NSE:NIFTY" },
      { id: "SENSEX", symbol: "SENSEX", tvSymbol: "BSE:SENSEX" },
      { id: "BANKNIFTY", symbol: "BANKNIFTY", tvSymbol: "NSE:BANKNIFTY" },
      { id: "INDIAVIX", symbol: "INDIAVIX", tvSymbol: "NSE:INDIAVIX" },
      { id: "FINNIFTY", symbol: "FINNIFTY", tvSymbol: "NSE:CNXFINANCE" },
      { id: "MIDCPNIFTY", symbol: "MIDCPNIFTY", tvSymbol: "NSE:NIFTY_MID_SELECT" },
      { id: "NIFTY500", symbol: "NIFTY 500", tvSymbol: "NSE:CNX500" },
      { id: "NIFTY_SMALLCAP", symbol: "NIFTY SMALL CAP", tvSymbol: "NSE:CNXSMALLCAP" },
      { id: "NFTALPHA50", symbol: "NFTALPHA50", tvSymbol: "NSE:CNXALPHA50" },
      { id: "NIFTY_MICROCAP250", symbol: "NIFTY MICROCAP250", tvSymbol: "NSE:NIFTYMICROCAP250" },
      { id: "SMALLCAP50", symbol: "SMALLCAP50", tvSymbol: "NSE:CNXSMALLCAP" },
      { id: "BSE_BANKEX", symbol: "BSE BANKEX", tvSymbol: "BSE:BANKEX" },
      { id: "NIFTY_PHARMA", symbol: "NIFTY PHARMA", tvSymbol: "NSE:CNXPHARMA" },
      { id: "NIFTY_FMCG", symbol: "NIFTY FMCG", tvSymbol: "NSE:CNXFMCG" },
      { id: "NIFTY_METAL", symbol: "NIFTY METAL", tvSymbol: "NSE:CNXMETAL" },
      { id: "NIFTY_PSU_BANK", symbol: "NIFTY PSU BANK", tvSymbol: "NSE:CNXPSUBANK" },
      { id: "NIFTY_PVT_BANK", symbol: "NIFTY PVT BANK", tvSymbol: "NSE:NIFTYPVTBANK" },
      { id: "NIFTY_REALTY", symbol: "NIFTY REALTY", tvSymbol: "NSE:CNXREALTY" },
      { id: "NIFTY_OIL_GAS", symbol: "NIFTY OIL & GAS", tvSymbol: "NSE:CNXOILGAS" },
      { id: "NIFTY_MEDIA", symbol: "NIFTY MEDIA", tvSymbol: "NSE:CNXMEDIA" },
      { id: "NIFTY_ENERGY", symbol: "NIFTY ENERGY", tvSymbol: "NSE:CNXENERGY" },
      { id: "NIFTY_MNC", symbol: "NIFTY MNC", tvSymbol: "NSE:CNXMNC" },
      { id: "NIFTY_FINSERV", symbol: "NIFTY FINSERV", tvSymbol: "NSE:CNXFINANCE" },
      { id: "NIFTY_INFRA", symbol: "NIFTY INFRA", tvSymbol: "NSE:CNXINFRA" },
      { id: "NIFTY_IT", symbol: "NIFTY IT", tvSymbol: "NSE:CNXIT" },
      { id: "NIFTY_AUTO", symbol: "NIFTY AUTO", tvSymbol: "NSE:CNXAUTO" },
      { id: "GOLDCASE", symbol: "GOLDCASE", tvSymbol: "NSE:GOLDCASE" },
      { id: "TATSILV", symbol: "TATSILV", tvSymbol: "NSE:TATSILV" },
      { id: "GOLDBEES", symbol: "GOLDBEES", tvSymbol: "NSE:GOLDBEES" },
      { id: "SILVERBEES", symbol: "SILVERBEES", tvSymbol: "NSE:SILVERBEES" },
      { id: "NIFTYBEES", symbol: "NIFTYBEES", tvSymbol: "NSE:NIFTYBEES" }
    ];

    let stocks = [];

    function render() {
      const ticker = document.getElementById("ticker");
      const clone = document.getElementById("ticker-clone");
      if (!ticker || !stocks || stocks.length === 0) return;

      const html = stocks.map(function(s) {
        const isUp = s.direction === "UP";
        const cls = isUp ? "up" : "down";
        const arrow = isUp ? "▲" : "▼";
        return '<span class="item">' +
          '<span class="symbol">' + s.symbol + '</span>' +
          '<span class="value">' + s.value + '</span>' +
          '<span class="' + cls + '"><span class="arrow">' + arrow + '</span> ' + s.change + ' (' + s.percent + ')</span>' +
        '</span>';
      }).join("");

      ticker.innerHTML = html;
      clone.innerHTML = html;

      // Duration based on content width for seamless loop
      const tickerTrack = document.getElementById("ticker-track");
      const pxPerSec = 50;
      const contentWidth = ticker.scrollWidth;
      const duration = Math.max(contentWidth / pxPerSec, 10);
      tickerTrack.style.animation = `seamless-scroll ${duration}s linear infinite`;
    }

    async function loadData() {
      try {
        const res = await fetch("/api/ticker");
        if (res.ok) {
          const json = await res.json();
          if (json.status && json.data && json.data.length > 0) {
            stocks = json.data;
            render();
            return;
          }
        }
      } catch (e) {
        // Backend not available (e.g. static GitHub pages hosting)
      }

      // Direct fallback to live TradingView scanner if backend is unavailable
      try {
        const tickers = INSTRUMENTS.map(function(s) { return s.tvSymbol; });
        const directRes = await fetch("https://scanner.tradingview.com/india/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            symbols: { tickers: tickers },
            columns: ["name", "close", "change", "change_abs"]
          })
        });
        if (directRes.ok) {
          const directJson = await directRes.json();
          if (directJson && Array.isArray(directJson.data)) {
            const map = {};
            directJson.data.forEach(function(item) {
              map[item.s] = { price: item.d[1], pct: item.d[2], abs: item.d[3] };
            });
            stocks = INSTRUMENTS.map(function(s) {
              const live = map[s.tvSymbol];
              if (live && live.price !== undefined && live.price !== null) {
                const val = parseFloat(live.price).toFixed(2);
                const chgAbs = parseFloat(live.abs || 0).toFixed(2);
                const chgPct = parseFloat(live.pct || 0).toFixed(2);
                const isUp = parseFloat(chgAbs) >= 0;
                return {
                  ...s,
                  value: val,
                  change: isUp ? "+" + chgAbs : chgAbs,
                  percent: isUp ? "+" + chgPct + "%" : chgPct + "%",
                  direction: isUp ? "UP" : "DOWN"
                };
              }
              return s;
            });
            render();
          }
        }
      } catch(err) {
        console.error("Direct fetch error:", err);
      }
    }

    // Initialize immediately
    applyConfig();
    render();
    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
