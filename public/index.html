<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock LED Ticker - 2016x16</title>
  <style>
    :root {
      --font-size: 10px;
      --y-offset: 2px; /* Shifted DOWN by 2px for perfect vertical centering of 10px font */
      --gap: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #FFFFFF;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .ticker-viewport {
      width: 100%;
      height: 100vh;
      max-height: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      position: relative;
      background: #000000;
    }

    /* Boundary lines for 16px calibration (when ?guide=1 or 'G' key pressed) */
    .ticker-viewport.guide-mode::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #ff0055;
      z-index: 100;
    }
    .ticker-viewport.guide-mode::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #00e5ff;
      z-index: 100;
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      animation: scroll linear infinite;
      will-change: transform;
      position: relative;
      top: var(--y-offset, 2px);
    }

    .ticker-text {
      display: inline-flex;
      align-items: center;
      font-family: Arial Black, "Arial Black", Impact, sans-serif;
      font-size: 10px; /* Fixed to 10px */
      font-weight: 900;
      line-height: 1;
    }

    .item {
      display: inline-flex;
      align-items: center;
      margin-right: var(--gap, 20px);
      line-height: 1;
      white-space: nowrap;
    }

    .symbol {
      color: #FFD700;
      margin-right: 4px;
      font-weight: 900;
    }

    .value {
      color: #FFFFFF;
      margin-right: 4px;
      font-weight: 900;
    }

    .up {
      color: #00FF00;
      display: inline-flex;
      align-items: center;
      font-weight: 900;
    }

    .down {
      color: #FF3333;
      display: inline-flex;
      align-items: center;
      font-weight: 900;
    }

    .arrow {
      display: inline-block;
      margin-right: 2px;
      line-height: 1;
      font-size: 10px;
    }

    /* Live notification for keyboard adjustments */
    #info-toast {
      position: fixed;
      top: 1px;
      right: 4px;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #444;
      color: #00ffea;
      font-family: monospace;
      font-size: 8px;
      padding: 1px 4px;
      z-index: 999;
      display: none;
    }

    @keyframes scroll {
      0%   { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="ticker-viewport" id="viewport">
    <div class="ticker-track" id="ticker-track">
      <div class="ticker-text" id="ticker"></div>
    </div>
  </div>

  <div id="info-toast"></div>

  <script>
    function getStoredConfig() {
      try {
        const raw = localStorage.getItem("ticker_config_v5");
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const saved = getStoredConfig();

    function getNum(paramVal, savedVal, defaultVal) {
      if (paramVal !== null && paramVal !== undefined && paramVal !== "" && !isNaN(Number(paramVal))) {
        return Number(paramVal);
      }
      if (savedVal !== null && savedVal !== undefined && savedVal !== "" && !isNaN(Number(savedVal))) {
        return Number(savedVal);
      }
      return defaultVal;
    }

    const config = {
      yOffset: getNum(urlParams.get("y"), saved.yOffset, 2), // Default +2px down for 10px font
      fontSize: 10, // Fixed 10px
      gap: getNum(urlParams.get("gap"), saved.gap, 20),
      speed: getNum(urlParams.get("speed"), saved.speed, 60),
      guide: urlParams.get("guide") === "1"
    };

    function applyConfig() {
      document.documentElement.style.setProperty("--y-offset", config.yOffset + "px");
      document.documentElement.style.setProperty("--font-size", config.fontSize + "px");
      document.documentElement.style.setProperty("--gap", config.gap + "px");

      const viewport = document.getElementById("viewport");
      if (viewport) {
        if (config.guide) {
          viewport.classList.add("guide-mode");
        } else {
          viewport.classList.remove("guide-mode");
        }
      }

      const tickerTrack = document.getElementById("ticker-track");
      if (tickerTrack) {
        tickerTrack.style.animationDuration = config.speed + "s";
      }

      try {
        localStorage.setItem("ticker_config_v5", JSON.stringify(config));
      } catch (e) {}
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("info-toast");
      if (!toast) return;
      toast.textContent = msg || `Y: ${config.yOffset}px | Size: 10px | Speed: ${config.speed}s`;
      toast.style.display = "block";
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() {
        toast.style.display = "none";
      }, 2500);
    }

    // Keyboard Shortcuts for Live Adjustment
    window.addEventListener("keydown", function(e) {
      let changed = false;
      if (e.key === "ArrowUp") {
        config.yOffset -= 1; // Move text UP
        changed = true;
      } else if (e.key === "ArrowDown") {
        config.yOffset += 1; // Move text DOWN
        changed = true;
      } else if (e.key === "]" || e.key === "}") {
        config.speed += 5; // Slower scroll
        changed = true;
      } else if (e.key === "[" || e.key === "{") {
        config.speed = Math.max(5, config.speed - 5); // Faster scroll
        changed = true;
      } else if (e.key.toLowerCase() === "g") {
        config.guide = !config.guide; // Toggle guide
        changed = true;
      } else if (e.key.toLowerCase() === "r") {
        config.yOffset = 2;
        config.gap = 20;
        config.speed = 60;
        changed = true;
      }

      if (changed) {
        applyConfig();
        showToast();
      }
    });

    // Complete list of all instruments from all images
    let stocks = [
      { id: "NIFTY", symbol: "NIFTY 50", tvSymbol: "NSE:NIFTY", value: "24214.05", change: "+135.75", percent: "+0.56%", direction: "UP" },
      { id: "SENSEX", symbol: "SENSEX", tvSymbol: "BSE:SENSEX", value: "77443.73", change: "+534.05", percent: "+0.69%", direction: "UP" },
      { id: "BANKNIFTY", symbol: "BANKNIFTY", tvSymbol: "NSE:BANKNIFTY", value: "57612.45", change: "+372.70", percent: "+0.65%", direction: "UP" },
      { id: "INDIAVIX", symbol: "INDIAVIX", tvSymbol: "NSE:INDIAVIX", value: "10.67", change: "-0.65", percent: "-5.74%", direction: "DOWN" },
      { id: "FINNIFTY", symbol: "FINNIFTY", tvSymbol: "NSE:CNXFINANCE", value: "26241.40", change: "+228.40", percent: "+0.88%", direction: "UP" },
      { id: "MIDCPNIFTY", symbol: "MIDCPNIFTY", tvSymbol: "NSE:NIFTY_MID_SELECT", value: "14954.35", change: "+86.45", percent: "+0.57%", direction: "UP" },
      { id: "NIFTY500", symbol: "NIFTY 500", tvSymbol: "NSE:CNX500", value: "23531.60", change: "+145.40", percent: "+0.62%", direction: "UP" },
      { id: "NIFTY_SMALLCAP", symbol: "NIFTY SMALL CAP", tvSymbol: "NSE:CNXSMALLCAP", value: "18391.55", change: "+111.35", percent: "+1.12%", direction: "UP" },
      { id: "NFTALPHA50", symbol: "NFTALPHA50", tvSymbol: "NSE:CNXALPHA50", value: "56244.60", change: "+467.65", percent: "+0.84%", direction: "UP" },
      { id: "NIFTY_MICROCAP250", symbol: "NIFTY MICROCAP250", tvSymbol: "NSE:NIFTYMICROCAP250", value: "26322.50", change: "+190.65", percent: "+0.73%", direction: "UP" },
      { id: "SMALLCAP50", symbol: "SMALLCAP50", tvSymbol: "NSE:CNXSMALLCAP", value: "9956.95", change: "+111.35", percent: "+1.12%", direction: "UP" },
      { id: "BSE_BANKEX", symbol: "BSE BANKEX", tvSymbol: "BSE:BANKEX", value: "65272.32", change: "+478.86", percent: "+0.74%", direction: "UP" },
      { id: "NIFTY_PHARMA", symbol: "NIFTY PHARMA", tvSymbol: "NSE:CNXPHARMA", value: "26403.70", change: "+89.90", percent: "+0.34%", direction: "UP" },
      { id: "NIFTY_FMCG", symbol: "NIFTY FMCG", tvSymbol: "NSE:CNXFMCG", value: "47625.35", change: "+151.45", percent: "+0.32%", direction: "UP" },
      { id: "NIFTY_METAL", symbol: "NIFTY METAL", tvSymbol: "NSE:CNXMETAL", value: "13084.65", change: "+61.40", percent: "+0.47%", direction: "UP" },
      { id: "NIFTY_PSU_BANK", symbol: "NIFTY PSU BANK", tvSymbol: "NSE:CNXPSUBANK", value: "8657.50", change: "+39.85", percent: "+0.46%", direction: "UP" },
      { id: "NIFTY_PVT_BANK", symbol: "NIFTY PVT BANK", tvSymbol: "NSE:NIFTYPVTBANK", value: "27470.90", change: "+263.20", percent: "+0.97%", direction: "UP" },
      { id: "NIFTY_REALTY", symbol: "NIFTY REALTY", tvSymbol: "NSE:CNXREALTY", value: "906.05", change: "+10.70", percent: "+1.20%", direction: "UP" },
      { id: "NIFTY_OIL_GAS", symbol: "NIFTY OIL & GAS", tvSymbol: "NSE:CNXOILGAS", value: "11194.25", change: "+17.35", percent: "+0.16%", direction: "UP" },
      { id: "NIFTY_MEDIA", symbol: "NIFTY MEDIA", tvSymbol: "NSE:CNXMEDIA", value: "1614.05", change: "+26.10", percent: "+1.64%", direction: "UP" },
      { id: "NIFTY_ENERGY", symbol: "NIFTY ENERGY", tvSymbol: "NSE:CNXENERGY", value: "38204.35", change: "+79.90", percent: "+0.21%", direction: "UP" },
      { id: "NIFTY_MNC", symbol: "NIFTY MNC", tvSymbol: "NSE:CNXMNC", value: "33223.60", change: "+150.70", percent: "+0.46%", direction: "UP" },
      { id: "NIFTY_FINSERV", symbol: "NIFTY FINSERV", tvSymbol: "NSE:CNXFINANCE", value: "28537.40", change: "+216.90", percent: "+0.77%", direction: "UP" },
      { id: "NIFTY_INFRA", symbol: "NIFTY INFRA", tvSymbol: "NSE:CNXINFRA", value: "9347.20", change: "+41.65", percent: "+0.45%", direction: "UP" },
      { id: "NIFTY_IT", symbol: "NIFTY IT", tvSymbol: "NSE:CNXIT", value: "30657.10", change: "+224.05", percent: "+0.74%", direction: "UP" },
      { id: "NIFTY_AUTO", symbol: "NIFTY AUTO", tvSymbol: "NSE:CNXAUTO", value: "29336.00", change: "+150.60", percent: "+0.52%", direction: "UP" },
      { id: "GOLDCASE", symbol: "GOLDCASE", tvSymbol: "NSE:GOLDCASE", value: "24.55", change: "+0.62", percent: "+2.59%", direction: "UP" },
      { id: "TATSILV", symbol: "TATSILV", tvSymbol: "NSE:TATSILV", value: "22.99", change: "+1.03", percent: "+4.69%", direction: "UP" },
      { id: "GOLDBEES", symbol: "GOLDBEES", tvSymbol: "NSE:GOLDBEES", value: "128.87", change: "+3.14", percent: "+2.50%", direction: "UP" },
      { id: "SILVERBEES", symbol: "SILVERBEES", tvSymbol: "NSE:SILVERBEES", value: "226.09", change: "+9.66", percent: "+4.46%", direction: "UP" },
      { id: "NIFTYBEES", symbol: "NIFTYBEES", tvSymbol: "NSE:NIFTYBEES", value: "276.42", change: "+1.80", percent: "+0.66%", direction: "UP" }
    ];

    function render() {
      const ticker = document.getElementById("ticker");
      if (!ticker || !stocks || stocks.length === 0) return;

      ticker.innerHTML = stocks.map(function(s) {
        const isUp = s.direction === "UP";
        const cls = isUp ? "up" : "down";
        const arrow = isUp ? "▲" : "▼";
        return '<span class="item">' +
          '<span class="symbol">' + s.symbol + '</span>' +
          '<span class="value">' + s.value + '</span>' +
          '<span class="' + cls + '"><span class="arrow">' + arrow + '</span> ' + s.change + ' (' + s.percent + ')</span>' +
        '</span>';
      }).join("");

      const calculatedDuration = Math.max(stocks.length * 4.5, config.speed);
      const tickerTrack = document.getElementById("ticker-track");
      if (tickerTrack) {
        tickerTrack.style.animationDuration = calculatedDuration + "s";
      }
    }

    async function loadData() {
      try {
        const res = await fetch("/api/ticker");
        if (res.ok) {
          const json = await res.json();
          if (json.status && json.data && json.data.length > 0) {
            stocks = json.data;
            render();
            return;
          }
        }
      } catch (e) {
        // Backend not available (e.g. static GitHub pages hosting)
      }

      // Direct fallback to live TradingView scanner if backend is unavailable
      try {
        const tickers = stocks.map(function(s) { return s.tvSymbol; });
        const directRes = await fetch("https://scanner.tradingview.com/india/scan", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            symbols: { tickers: tickers },
            columns: ["name", "close", "change", "change_abs"]
          })
        });
        if (directRes.ok) {
          const directJson = await directRes.json();
          if (directJson && Array.isArray(directJson.data)) {
            const map = {};
            directJson.data.forEach(function(item) {
              map[item.s] = { price: item.d[1], pct: item.d[2], abs: item.d[3] };
            });
            stocks = stocks.map(function(s) {
              const live = map[s.tvSymbol];
              if (live && live.price !== undefined && live.price !== null) {
                const val = parseFloat(live.price).toFixed(2);
                const chgAbs = parseFloat(live.abs || 0).toFixed(2);
                const chgPct = parseFloat(live.pct || 0).toFixed(2);
                const isUp = parseFloat(chgAbs) >= 0;
                return {
                  ...s,
                  value: val,
                  change: isUp ? "+" + chgAbs : chgAbs,
                  percent: isUp ? "+" + chgPct + "%" : chgPct + "%",
                  direction: isUp ? "UP" : "DOWN"
                };
              }
              return s;
            });
            render();
          }
        }
      } catch(err) {
        console.error("Direct fetch error:", err);
      }
    }

    // Initialize immediately
    applyConfig();
    render();
    loadData();
    setInterval(loadData, 5000);
  </script>
</body>
</html>
