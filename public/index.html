<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock LED Ticker - 2016x16</title>
  <style>
    :root {
      --font-size: 8px;
      --y-offset: 3px; /* Shifted DOWN by 3px for perfect vertical centering */
      --gap: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000000;
      color: #FFFFFF;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .ticker-viewport {
      width: 100%;
      height: 100vh;
      max-height: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      position: relative;
      background: #000000;
    }

    /* Boundary lines for 16px calibration (when ?guide=1 or 'G' key pressed) */
    .ticker-viewport.guide-mode::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #ff0055;
      z-index: 100;
    }
    .ticker-viewport.guide-mode::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: #00e5ff;
      z-index: 100;
    }

    .ticker-track {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
      animation: scroll linear infinite;
      will-change: transform;
      position: relative;
      top: var(--y-offset, 3px);
    }

    .ticker-text {
      display: inline-flex;
      align-items: center;
      font-family: Arial Black, "Arial Black", Impact, sans-serif;
      font-size: 8px;
      font-weight: 900;
      line-height: 1;
    }

    .item {
      display: inline-flex;
      align-items: center;
      margin-right: var(--gap, 20px);
      line-height: 1;
      white-space: nowrap;
    }

    .symbol {
      color: #FFD700;
      margin-right: 4px;
      font-weight: 900;
    }

    .value {
      color: #FFFFFF;
      margin-right: 4px;
      font-weight: 900;
    }

    .up {
      color: #00FF00;
      display: inline-flex;
      align-items: center;
      font-weight: 900;
    }

    .down {
      color: #FF3333;
      display: inline-flex;
      align-items: center;
      font-weight: 900;
    }

    .arrow {
      display: inline-block;
      margin-right: 2px;
      line-height: 1;
      font-size: 8px;
    }

    /* Live notification for keyboard adjustments */
    #info-toast {
      position: fixed;
      top: 1px;
      right: 4px;
      background: rgba(0, 0, 0, 0.9);
      border: 1px solid #444;
      color: #00ffea;
      font-family: monospace;
      font-size: 8px;
      padding: 1px 4px;
      z-index: 999;
      display: none;
    }

    @keyframes scroll {
      0%   { transform: translateX(100vw); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>
<body>
  <div class="ticker-viewport" id="viewport">
    <div class="ticker-track" id="ticker-track">
      <div class="ticker-text" id="ticker"></div>
    </div>
  </div>

  <div id="info-toast"></div>

  <script>
    function getStoredConfig() {
      try {
        const raw = localStorage.getItem("ticker_config_v4");
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    const saved = getStoredConfig();

    function getNum(paramVal, savedVal, defaultVal) {
      if (paramVal !== null && paramVal !== undefined && paramVal !== "" && !isNaN(Number(paramVal))) {
        return Number(paramVal);
      }
      if (savedVal !== null && savedVal !== undefined && savedVal !== "" && !isNaN(Number(savedVal))) {
        return Number(savedVal);
      }
      return defaultVal;
    }

    const config = {
      yOffset: getNum(urlParams.get("y"), saved.yOffset, 3), // Default +3px down
      fontSize: 8,
      gap: getNum(urlParams.get("gap"), saved.gap, 20),
      speed: getNum(urlParams.get("speed"), saved.speed, 40),
      guide: urlParams.get("guide") === "1"
    };

    function applyConfig() {
      document.documentElement.style.setProperty("--y-offset", config.yOffset + "px");
      document.documentElement.style.setProperty("--font-size", config.fontSize + "px");
      document.documentElement.style.setProperty("--gap", config.gap + "px");

      const viewport = document.getElementById("viewport");
      if (viewport) {
        if (config.guide) {
          viewport.classList.add("guide-mode");
        } else {
          viewport.classList.remove("guide-mode");
        }
      }

      const tickerTrack = document.getElementById("ticker-track");
      if (tickerTrack) {
        tickerTrack.style.animationDuration = config.speed + "s";
      }

      try {
        localStorage.setItem("ticker_config_v4", JSON.stringify(config));
      } catch (e) {}
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("info-toast");
      if (!toast) return;
      toast.textContent = msg || `Y: ${config.yOffset}px | Size: 8px | Speed: ${config.speed}s`;
      toast.style.display = "block";
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function() {
        toast.style.display = "none";
      }, 2500);
    }

    // Keyboard Shortcuts for Live Adjustment
    window.addEventListener("keydown", function(e) {
      let changed = false;
      if (e.key === "ArrowUp") {
        config.yOffset -= 1; // Move text UP
        changed = true;
      } else if (e.key === "ArrowDown") {
        config.yOffset += 1; // Move text DOWN
        changed = true;
      } else if (e.key === "]" || e.key === "}") {
        config.speed += 5; // Slower scroll
        changed = true;
      } else if (e.key === "[" || e.key === "{") {
        config.speed = Math.max(5, config.speed - 5); // Faster scroll
        changed = true;
      } else if (e.key.toLowerCase() === "g") {
        config.guide = !config.guide; // Toggle guide
        changed = true;
      } else if (e.key.toLowerCase() === "r") {
        config.yOffset = 3;
        config.gap = 20;
        config.speed = 40;
        changed = true;
      }

      if (changed) {
        applyConfig();
        showToast();
      }
    });

    // Default immediate stock data
    let stocks = [
      { symbol: "NIFTY 50", value: "24078.30", change: "-76.60", percent: "-0.32%", direction: "DOWN" },
      { symbol: "NIFTY BANK", value: "51245.80", change: "+142.50", percent: "+0.28%", direction: "UP" },
      { symbol: "NIFTY IT", value: "38920.15", change: "+310.40", percent: "+0.80%", direction: "UP" },
      { symbol: "NIFTY AUTO", value: "22450.60", change: "-115.20", percent: "-0.51%", direction: "DOWN" },
      { symbol: "NIFTY PHARMA", value: "21680.45", change: "+85.30", percent: "+0.39%", direction: "UP" },
      { symbol: "NIFTY METAL", value: "9340.10", change: "-42.70", percent: "-0.45%", direction: "DOWN" },
      { symbol: "NIFTY FMCG", value: "56780.90", change: "+120.15", percent: "+0.21%", direction: "UP" },
      { symbol: "NIFTY NEXT 50", value: "68450.25", change: "-180.60", percent: "-0.26%", direction: "DOWN" },
      { symbol: "NIFTY MIDCAP 100", value: "54230.70", change: "+95.80", percent: "+0.18%", direction: "UP" },
      { symbol: "NIFTY SMALLCAP 100", value: "17850.40", change: "-35.20", percent: "-0.20%", direction: "DOWN" }
    ];

    function render() {
      const ticker = document.getElementById("ticker");
      if (!ticker || !stocks || stocks.length === 0) return;

      ticker.innerHTML = stocks.map(function(s) {
        const isUp = s.direction === "UP";
        const cls = isUp ? "up" : "down";
        const arrow = isUp ? "▲" : "▼";
        return '<span class="item">' +
          '<span class="symbol">' + s.symbol + '</span>' +
          '<span class="value">' + s.value + '</span>' +
          '<span class="' + cls + '"><span class="arrow">' + arrow + '</span> ' + s.change + ' (' + s.percent + ')</span>' +
        '</span>';
      }).join("");

      const calculatedDuration = Math.max(stocks.length * 8, config.speed);
      const tickerTrack = document.getElementById("ticker-track");
      if (tickerTrack) {
        tickerTrack.style.animationDuration = calculatedDuration + "s";
      }
    }

    async function loadData() {
      try {
        const res = await fetch("/api/ticker");
        const json = await res.json();
        if (json.status && json.data && json.data.length > 0) {
          stocks = json.data;
          render();
        }
      } catch (e) {
        console.error("Fetch failed:", e);
      }
    }

    // Initialize immediately
    applyConfig();
    render();
    loadData();
    setInterval(loadData, 60000);
  </script>
</body>
</html>
